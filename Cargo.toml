[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/clipr"]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/TheMasked2/clipr"
publish = false

[workspace.dependencies]
clipr-core = { path = "crates/core" }
clipr-web = { path = "crates/web" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
tray-icon = "0.21"
windows-sys = "0.61"
# COM + WinRT bindings for capture, D3D11 and Media Foundation. One feature list for the whole workspace.
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
clipr-gpu = { path = "crates/gpu" }
clipr-capture = { path = "crates/capture" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
clipr-audio = { path = "crates/audio" }
clipr-buffer = { path = "crates/buffer" }
clipr-encode = { path = "crates/encode" }
clipr-games = { path = "crates/games" }
clipr-library = { path = "crates/library" }
clipr-mux = { path = "crates/mux" }
clipr-discord = { path = "crates/discord" }
clipr-cloud = { path = "crates/cloud" }
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "3", features = ["json"] }
clipr-update = { path = "crates/update" }
semver = "1"
sha2 = "0.11"
trash = "5"
nnnoiseless = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

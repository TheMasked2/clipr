[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/clipr"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/TheMasked2/clipr"
publish = false

[workspace.dependencies]
clipr-core = { path = "crates/core" }
clipr-web = { path = "crates/web" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
tray-icon = "0.21"
windows-sys = "0.61"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

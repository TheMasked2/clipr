[package]
name = "clipr"
description = "clipr: a lightweight, open source game recorder and clipper for Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clipr-core.workspace = true
clipr-web.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
clipr-buffer.workspace = true
clipr-capture.workspace = true
clipr-encode.workspace = true
clipr-audio.workspace = true
clipr-games.workspace = true
clipr-gpu.workspace = true
clipr-mux.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

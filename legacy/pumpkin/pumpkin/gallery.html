<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpkin Clips</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<style>
  :root {
    --bg: #0f0f10; --panel: #1a1a1d; --panel-2: #242428; --line: #2e2e33;
    --text: #f1f1f2; --muted: #a0a0a8; --accent: #ff8a1f; --accent-ink: #1a0d00; --danger: #ff5a5a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,15,16,.92); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { max-width: 1400px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .search { flex: 1 1 260px; display: flex; }
  .search input { width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
                  border-radius: 999px; padding: 9px 16px; font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .chips { max-width: 1400px; margin: 10px auto 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip { background: var(--panel-2); border: 0; color: var(--text); border-radius: 8px; padding: 7px 12px;
          font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); font-weight: 600; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  .grid { display: grid; gap: 24px 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { cursor: pointer; }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
           background: var(--panel-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .len { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); font-size: 12px;
         font-weight: 600; padding: 1px 5px; border-radius: 4px; }
  .shelf { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.7); font-size: 12px; padding: 2px 7px;
           border-radius: 6px; }
  .meta { padding: 10px 2px 0; }
  .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 16px; }
  dialog { border: 0; padding: 0; background: var(--panel); color: var(--text); border-radius: 16px;
           width: min(1100px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; }
  .info { padding: 16px; display: grid; gap: 10px; }
  .info h2 { margin: 0; font-size: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input, .row select { background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
                            border-radius: 8px; padding: 8px 10px; font: inherit; }
  .row input { flex: 1 1 240px; }
  button.act { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 14px;
               font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--panel-2); color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px;
                 font: inherit; cursor: pointer; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px;
                  padding: 8px 14px; font: inherit; cursor: pointer; }
  .note { color: var(--muted); font-size: 13px; min-height: 1em; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .logo { font-size: 16px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">🎃 Pumpkin <span>Clips</span></div>
    <label class="search"><input id="q" type="search" placeholder="Search titles, people, servers…" autocomplete="off"></label>
  </div>
  <nav class="chips" id="chips"></nav>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>
<dialog id="view">
  <video id="player" controls playsinline preload="metadata"></video>
  <div class="info">
    <h2 id="vtitle"></h2>
    <div class="sub" id="vsub"></div>
    <div id="editor" hidden>
      <div class="row">
        <input id="etitle" maxlength="100" aria-label="Title">
        <select id="ecat" aria-label="Shelf"></select>
        <button class="act" id="esave">Save</button>
        <button class="danger" id="edel">Delete</button>
      </div>
    </div>
    <div class="row"><button class="ghost" id="vclose">Close</button><span class="note" id="note"></span></div>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
let data = { categories: {}, clips: [] }, shelf = "all", open = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const len = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const when = iso => {
  const d = new Date(iso), days = (Date.now() - d) / 864e5;
  if (days < 1) return "today";
  if (days < 2) return "yesterday";
  if (days < 30) return Math.floor(days) + " days ago";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
};
const who = c => c.streamer_name && c.streamer_name !== c.asker_name
  ? `${c.streamer_name}'s screen · clipped by ${c.asker_name}` : `${c.asker_name || c.streamer_name}`;

function chips() {
  const all = { all: "All", ...data.categories };
  $("chips").innerHTML = Object.entries(all).map(([k, v]) => {
    const n = k === "all" ? data.clips.length : data.clips.filter(c => c.category === k).length;
    return `<button class="chip${k === shelf ? " on" : ""}" data-k="${k}">${esc(v)} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { shelf = b.dataset.k; render(); });
}

function render() {
  chips();
  const q = $("q").value.trim().toLowerCase();
  const shown = data.clips.filter(c => (shelf === "all" || c.category === shelf) &&
    (!q || [c.title, c.asker_name, c.streamer_name, c.names, c.server].join(" ").toLowerCase().includes(q)));
  $("grid").innerHTML = shown.map(c => `
    <article class="card" data-id="${esc(c.id)}">
      <div class="thumb"><img loading="lazy" src="/t/${esc(c.id)}.jpg" alt="">
        ${shelf === "all" ? `<span class="shelf">${esc((data.categories[c.category] || "").split(" ")[0])}</span>` : ""}
        <span class="len">${len(c.seconds)}</span></div>
      <div class="meta"><div class="title">${esc(c.title)}</div>
        <div class="sub">${esc(who(c))}</div>
        <div class="sub">${esc(c.server)} · ${when(c.created)}</div></div>
    </article>`).join("");
  $("grid").querySelectorAll(".card").forEach(el => el.onclick = () => show(el.dataset.id));
  $("empty").hidden = shown.length > 0;
  $("empty").textContent = data.clips.length ? "Nothing matches that." :
    "No saved clips yet. ⭐ a clip in #clips and pick a shelf, and it shows up here.";
}

function show(id) {
  open = data.clips.find(c => c.id === id);
  if (!open) return;
  $("player").src = `/v/${encodeURIComponent(open.id)}.mp4`;
  $("vtitle").textContent = open.title;
  $("vsub").textContent = `${who(open)} · ${open.server} · ${when(open.created)}` +
    (open.names ? ` · on tape: ${open.names}` : "");
  $("editor").hidden = !open.can_edit;
  $("etitle").value = open.title;
  $("ecat").innerHTML = Object.entries(data.categories)
    .map(([k, v]) => `<option value="${k}"${k === open.category ? " selected" : ""}>${esc(v)}</option>`).join("");
  $("note").textContent = "";
  $("view").showModal();
  $("player").play().catch(() => {});
}

function close() { $("player").pause(); $("player").removeAttribute("src"); $("player").load(); $("view").close(); }
$("vclose").onclick = close;
$("view").addEventListener("cancel", e => { e.preventDefault(); close(); });
$("view").addEventListener("click", e => { if (e.target === $("view")) close(); });

$("esave").onclick = async () => {
  const r = await fetch(`/api/clips/${encodeURIComponent(open.id)}`, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: $("etitle").value, category: $("ecat").value }) });
  if (!r.ok) { $("note").textContent = await r.text(); return; }
  const j = await r.json();
  open.title = j.title; open.category = j.category;
  $("vtitle").textContent = open.title;
  $("note").textContent = "Saved.";
  render();
};
$("edel").onclick = async () => {
  if (!confirm(`Delete “${open.title}” from the gallery for good?`)) return;
  const r = await fetch(`/api/clips/${encodeURIComponent(open.id)}`, { method: "DELETE" });
  if (!r.ok) { $("note").textContent = await r.text(); return; }
  data.clips = data.clips.filter(c => c.id !== open.id);
  close(); render();
};
$("q").addEventListener("input", render);

fetch("/api/clips").then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => { data = j; render(); })
  .catch(() => { $("empty").hidden = false; $("empty").textContent = "Couldn't load the clips. Get a fresh link with /clips gallery."; });
</script>
</body>
</html>
